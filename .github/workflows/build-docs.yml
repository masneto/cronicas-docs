name: Build Docs (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Docs Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}
          path: ./site
          retention-days: 1

      - name: Trigger deploy in other repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_GITHUB_TOKEN }}" \
            https://api.github.com/repos/masneto/cronicas-dispatch/dispatches \
            -d '{"event_type":"pr-preview","client_payload":{"pr_number": '${{ github.event.pull_request.number }}', "artifact_repo": "${{ github.repository }}"}}'
