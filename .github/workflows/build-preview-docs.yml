name: Build Docs Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Docs and Preview
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to access the source code
      - uses: actions/checkout@v4

      # Setup Python environment for MkDocs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Install MkDocs and Material theme for documentation generation
      - run: pip install mkdocs mkdocs-material

      # Build the documentation site into the ./site directory
      - run: mkdocs build --clean

      # Upload the generated site as an artifact, scoped to this PR
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}
          path: ./site
          retention-days: 1

      # Trigger deploy workflow in external repository to publish the preview
      - name: Trigger deploy in other repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_GITHUB_TOKEN }}" \
            https://api.github.com/repos/masneto/cronicas-dispatch/dispatches \
            -d '{"event_type":"pr-preview","client_payload":{"pr_number": '${{ github.event.pull_request.number }}', "artifact_repo": "${{ github.repository }}", "artifact_run_id": "${{ github.run_id }}"}}'
